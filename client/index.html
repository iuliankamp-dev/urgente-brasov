<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />

    <meta name="keywords" content="urgente brasov, servicii urgenta brasov, electrician brasov, instalator brasov, service auto brasov, tractari brasov, medic urgenta brasov" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Urgențe Brașov" />
    <meta name="theme-color" content="#c0392b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Urgențe Brașov" />
    <meta property="og:title" content="Urgențe Brașov — Servicii de urgență și intervenție" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Servicii de urgență și intervenție în Brașov — disponibili 24/7" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c0392b'/><text y='.9em' font-size='80' x='10'>⚡</text></svg>" />

    <!-- Google Fonts — Inter + Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Preload critical assets -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" as="style" />

    <!-- Schema.org WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Urgențe Brașov",
      "url": "https://urgentebrasov.ro",
      "description": "Marketplace pentru servicii de urgență și intervenție în Brașov",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://urgentebrasov.ro/cautare?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
